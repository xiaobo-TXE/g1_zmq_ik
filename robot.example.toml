# =============================================================================
# G1 双 Tag 抓放：一份配置管两个程序
#   main.py                    读 [main] 段
#   tools/detect_aruco_zmq.py  读 [aruco] 段
#
#   python main.py --config robot.toml
#   python tools/detect_aruco_zmq.py --config robot.toml
#
# 键名 = 参数名去掉 -- 并把 - 换成 _（--grip-on-arrive-soft -> grip_on_arrive_soft）。
# 命令行显式给的参数**优先**于这里；这里没写的键仍用程序内置默认值。
# 只想配一个程序时可以不分段：所有键直接写在顶层（程序读顶层 + 自己那段）。
# 也认 .json（老写法用 `_` 开头的键当注释），新配置建议用这份 .toml。
# =============================================================================

[main]

# ---- 链路：机器人 IP / 端口 ----
# require_vla=true 表示机器人不在 VLA 模式就不下发 6002（回到 VLA 会自动重新锚定）
robot_ip = "192.168.123.161"
state_port = 6001
cmd_port = 6002
gripper_port = 6004
mode_port = 6000
require_vla = true

# ---- 目标与交互 ----
# target_frame=torso 是 Tag 检测给的坐标系；interactive=true 表示常开、运行中可敲键盘命令
arm = "left"
target_frame = "torso"
interactive = true
target_timeout = 3          # 6003 多久没新目标就提示一次（只提示，手臂保持不动）

# ---- 夹爪：启动时先张开 ----
# grip=100 启动即把夹爪开到 100%。否则机器人侧保持它自己的状态（可能是闭合的），
# 手臂会带着闭合的夹爪往前推，把盒子推走
grip = 100

# ---- 夹爪标定（真机实测）----
# 电机值 0~5.0 rad（0=全闭，5.0=全开；再大不涨=被机器人侧截断），全开时两指内壁间距 8cm。
# 这三个值要与机器人侧 config.yaml 的 FSM.Groot.gripper 对齐
grip_open_cm = 8.0
grip_qmax_rad = 5.0
grip_qmin_rad = 0.0

# ---- 抓取：到位后位置闭合 ----
# 到位即把夹爪压到这个开合百分比（**位置闭合**，不做力反馈判断）。
# 34% = 电机 1.7 rad = 内壁开口约 2.72cm（夹 3cm 盒子总过盈约 2.8mm，真机实测稳夹）。
# 想更松就把百分比调大、更紧就调小；0=全闭。
# 与 grip_on_arrive_soft（力限软闭合）互斥，不能同时给。
grip_on_arrive = 34.0

# 自动动作只动受控臂那一侧（--arm left 就只动左爪）：到位闭爪 / 放置完松开 / 进 VLA 张开
# 都只作用于受控侧，未受控臂的夹爪保持机器人侧原状态。去掉本行 = 两侧都动。
# 交互命令 g/gc/go 与启动 --grip 不受影响（那是你显式给的）
grip_controlled_only = true

# 进入 VLA 时自动把夹爪张开到 100%：机器人侧会 latch 上一次夹爪目标并 100Hz 重发，
# 退出 VLA 再进入也不会清掉它（重进后夹爪可能还闭合着）—— 本项把它拉回张开。
# 6000 失联/帧太旧不算"进入"，夹着盒子时不会误张开
grip_open_on_vla = true

# ---- 双 Tag 自动搬运：抓到盒子后自动搬到放置点并松爪 ----
# 收到检测端的 place_pos 后才生效；检测端不带 place_pos 时本项不生效（行为同旧版）
auto_place = true

# 抬臂前的最短等待：闭爪指令发出后至少等这么久，且夹爪**实测确实合上**了才起抬臂
# （没有 6004 力反馈时最多等到 place_wait_max_s 就动手，不会卡住）。
# 0.7 = 覆盖"从全开收到 34%"的物理时间：机器人侧夹爪限速 6 rad/s，
#       (5.0-1.7)/6 ≈ 0.55s，留一点余量
place_settle_s = 0.7
place_wait_max_s = 3.0

# 放置路径的抬升余量（mm）：先竖直抬到 max(当前z, 目标z)+余量，再水平平移，最后下落。
# 不能按轴分解直接走 —— 那会贴着桌面横拖，把盒子拖倒
place_clearance = 50.0

# ---- 到位判定 ----
# 只判「末端位置 + 末端速度」两条：位置≤30mm 且 末端速度≤50mm/s 即算到位。
# 其余一律不判：姿态填 44°≈不约束、可达性 ik=0=不判、关节速度 1000°≈不判、驻留 0=单帧即可
arrive_pos = 30.0
arrive_rot = 44.0
arrive_ik_pos = 0
arrive_ik_rot = 0
arrive_dwell = 0.0
arrive_speed = 50.0
arrive_joint_speed = 1000.0
# 容差护栏已关：arrive_object_mm=0 不再校验「位置容差 < 物体窄边」（否则 50mm ≥ 30mm
# 会启动即报错退出）。改回非 0（例如 30）会自动恢复校验
arrive_object_mm = 0

# ---- 笛卡尔直线 ----
# 抓取进给/退出走直线（PTP 转场 + LIN 进给）。lin_approach=0 完全关闭，行为与没有本功能时逐字一致。
# 开之前确认 pre-grasp 点（= 抓取点沿工具轴后退 lin_approach）落在自由空间里
lin_approach = 60
lin_jerk = 2.0

# lin_all：所有绝对位置目标都从当前位置按 Z→Y→X 自动轴分解成若干轴对齐直线段
# （只挑真正变了的轴），每段直线、段间速度归零（角点停一下）。
# 与 lin_approach 同开时 lin_all 优先（两段式接近被忽略）；
# 反解连续失败 lin_abort_cycles 个周期会自动取消整条路径并停住
lin_all = true

[aruco]

# ---- 相机图像流（Tag 检测订阅它）----
endpoint = "tcp://10.3.42.221:5556"
marker_size = 0.025                    # 标签边长（米）
dictionary = "DICT_APRILTAG_36H11"
ids = [3, 4]                           # 放行的 ID；角色不能是同一个 ID

# ---- 双 Tag 抓放的角色 ----
# pick_id = 抓取码（贴盒子）；place_id = 放置码（贴落点/桌面）。
# **两个码同时在画面里**才开始下发；place_id = 0 关掉双 Tag（回到单码行为）
pick_id = 3
place_id = 4

# ---- 抓取点：标记中心 -> 抓取点（米，标签自身坐标系）----
# 标签平贴盒顶时 -z 就是往下。标签贴在**顶面靠机器人那一端**，取 -0.09（半高=腰部）
# 时抓取点落在盒子近端，水平进给不会把手伸进盒体。
# 指垫想再往里一点，就用面内分量沿"远离机器人"方向微调（本例标签下 -tag.y ≈ 远离机器人）
marker_to_grasp = [-0.03, 0.0, -0.09]

# ---- 放置点：放置码中心 -> 放置点（米，放置码自身坐标系）----
# 注意 z 的符号与抓取**相反**：抓取码在盒顶、抓取点在标签下方，所以是 -0.09；
# 放置码在桌面、末端（=盒腰那个抓取点）必须抬到桌面**上方**，所以是 +0.09。
# 数值 = 盒底到抓取点的距离（盒高 18cm、腰部抓取 = 半高 9cm）。
# 给 0 会让末端停在桌面高度、盒子下半截压进桌子；给 -0.09 更糟。
# 宁可高 2~3mm（盒子轻轻落一下）也别低 —— 位置控制下低了会一直往下顶
place_marker_to_grasp = [0.0, 0.0, 0.09]

# 夹爪相对放置码的对准（弧度，ZYX，放置码坐标系）。
# 只影响 send_quat=true 时下发的 place_quat；send_quat=false 时放置沿用启动锁定的朝向
place_align_rpy = [0.0, 0.0, 0.0]

# ---- 抓取朝向：夹爪相对标签的对准（弧度，ZYX，标签坐标系）----
# 0 0 -1.5708 = 水平向前探入、手指左右开合（跨盒子 3cm 窄边）、z 朝上。
# 只取决于标签在盒顶的面内旋转：用 --no-send --suggest-align 让工具按当前标签轴
# 直接算并打印预期 axes(ee/torso) 核对。别再改成从上往下 —— 标签在近端，水平进给不会顶到盒子
grasp_align_rpy = [0.0, 0.0, -1.5708]

# ---- 下发 6003 ----
target_endpoint = "tcp://127.0.0.1:6003"   # main.py 的目标口（它 bind PULL）
target_hz = 20.0
deadband_mm = 2.0
jump_reject_mm = 100.0

# ---- 锁存：切断"推远 -> 追 -> 再推"的追逐环 ----
# latch_first=true 只下发【第一次成功发出的】目标，之后检测不再更新它。夹爪碰到标签会把码推远，
# 控制器于是追新位置、再碰、再推 —— 手臂永远到不了位，夹爪自然也不动作。
# 代价：之后盒子/相机真的移动了也不会自动更新，需重启检测端（或按 r）重新锁存。
# 若担心控制端中途重启，可加 latch_resend_hz = 1 让它按秒重发同一个锁存值（重发旧值，不是更新）
latch_first = true

# ---- IPPE 双解消歧：破"镜像支" ----
# 平面标签的两个解重投影只差零点几像素，首帧按重投影选等于让噪声定姿态；选中镜像支后
# 时间连续性会锁死它（姿态差约 90°，抓取点会被转偏 100mm+，只发位置也中招）。
# marker_up=true 用「标签平贴朝上」这个先验破平局；标签竖贴时设 false，退回按重投影选
marker_up = true

# ---- 只发位置 ----
# send_quat=false -> 帧里只有 {"pos":...}，末端姿态保持**启动瞬间锁定的朝向**。
# 所以启动 main.py 时手臂应处于你想要的进给姿态（手朝前、手指水平）。想跟标记转就设 true
send_quat = false

# 调试：先用 --no-send 看 axes(marker/torso) 与 axes(ee/torso)，确认偏移方向和手指开合方向
print_axes = true

# =============================================================================
# 视觉流程（README §3）：机器人先进 Groot+VLA -> 先起 main.py（不给 --pos）
# -> 再起 tools/detect_aruco_zmq.py；到位后按 grip_on_arrive 自动闭爪
# =============================================================================
